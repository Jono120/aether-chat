name: Terraform

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  push:
    branches:
      - main
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment tfvars
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_FILE: environments/dev.tfvars
  TF_BACKEND_KEY: ${{ vars.TF_PROJECT_NAME }}-dev.terraform.tfstate

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Azure login (OIDC)
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform init \
            -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} \
            -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} \
            -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }} \
            -backend-config=key=${{ env.TF_BACKEND_KEY }}

      - name: Terraform plan
        run: terraform plan -no-color -var-file=${{ env.TF_VAR_FILE }} -out=tfplan
        continue-on-error: false

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve environment
        id: env
        run: |
          PROJECT="${{ vars.TF_PROJECT_NAME }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "var_file=environments/prod.tfvars" >> "$GITHUB_OUTPUT"
            echo "backend_key=${PROJECT}-prod.terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "var_file=environments/dev.tfvars" >> "$GITHUB_OUTPUT"
            echo "backend_key=${PROJECT}-dev.terraform.tfstate" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform init \
            -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} \
            -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} \
            -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }} \
            -backend-config=key=${{ steps.env.outputs.backend_key }}

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file=${{ steps.env.outputs.var_file }}
